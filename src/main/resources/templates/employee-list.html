<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container mt-4">
    <h2>Employee List</h2>
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">Add Employee</button>
    <div th:if="${errorMessages}">
        <ul>
            <li th:each="error : ${errorMessages}" th:text="${error.defaultMessage}" style="color: red;"></li>
        </ul>
    </div>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>City</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.firstName}"></td>
            <td th:text="${employee.lastName}"></td>
            <td th:text="${employee.email}"></td>
            <td th:text="${employee.phone}"></td>
            <td th:text="${employee.city}"></td>
            <td>
                <button class="btn btn-warning btn-edit" th:data-id="${employee.id}" data-bs-toggle="modal" data-bs-target="#editEmployeeModal">Edit</button>
                <button class="btn btn-danger btn-delete" th:data-id="${employee.id}" data-bs-toggle="modal" data-bs-target="#deleteEmployeeModal">Delete</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Add Employee Modal -->
<div class="modal fade" id="addEmployeeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Employee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/home/save}" method="post">
                <div class="modal-body">
                    <input type="text" name="firstName" class="form-control mb-2" placeholder="First Name" required>
                    <input type="text" name="lastName" class="form-control mb-2" placeholder="Last Name" required>
                    <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
                    <input type="text" name="phone" class="form-control mb-2" placeholder="Phone" required>
                    <input type="text" name="city" class="form-control mb-2" placeholder="City" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Employee</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Employee Modal -->
<div class="modal fade" id="editEmployeeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Employee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editEmployeeForm" method="post">
                <div class="modal-body">
                    <input type="hidden" name="id" id="edit-id">
                    <input type="text" name="firstName" id="edit-firstName" class="form-control mb-2" required>
                    <input type="text" name="lastName" id="edit-lastName" class="form-control mb-2" required>
                    <input type="email" name="email" id="edit-email" class="form-control mb-2" required>
                    <input type="text" name="phone" id="edit-phone" class="form-control mb-2" required>
                    <input type="text" name="city" id="edit-city" class="form-control mb-2" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-warning">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        $(".btn-edit").click(function () {
            let id = $(this).data("id");
            $.get("/edit/" + id, function (data) {
                $("#edit-id").val(data.id);
                $("#edit-firstName").val(data.firstName);
                $("#edit-lastName").val(data.lastName);
                $("#edit-email").val(data.email);
                $("#edit-phone").val(data.phone);
                $("#edit-city").val(data.city);
                $("#editEmployeeForm").attr("action", "/home/update/" + data.id);
            });
        });

        $(".btn-delete").click(function () {
            let id = $(this).data("id");
            $.post("/home/delete/" + id, function () {
                location.reload();
            });
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

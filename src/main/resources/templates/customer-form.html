<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Form</title>
    <style>
        .error{
            color:red
        }
    </style>
</head>
<body>
    <form th:action="@{/process-form}" th:object="${customer}" method="post">
        Name <input type="text" th:field="*{name}"  />
        <br><br>
        Email <input type="email" th:field="*{email}"  />
        <br><br>
        Phone <input type="number" th:field="*{phone}"  />
        <br><br>
        <!--   add error message  -->
        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"
              class="error"
        ></span>
        <br><br>
        <!--   add error message  -->
        <span th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"
              class="error"
        ></span>
        <br><br>
        <!--   add error message  -->
        <span th:if="${#fields.hasErrors('phone')}"
              th:errors="*{phone}"
              class="error"
        ></span>
        <input type="submit" value="submit" />
    </form>
</body>
</html>

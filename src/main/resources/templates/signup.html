<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header text-center">
                    <h4>Form Registrasi</h4>
                </div>
                <div class="card-body">
                    <form action="#" th:action="@{/req/signup}" th:object="${member}" method="post">
                        <div class="mb-3">
                            <label for="userId" class="form-label">User ID</label>
                            <input type="text" class="form-control" id="userId" name="userId" th:field="*{userId}" th:errorclass="is-invalid">
                            <small class="text-danger" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></small>
                        </div>
                        <div class="mb-3">
                            <label for="pw" class="form-label">Password</label>
                            <input type="password" class="form-control" id="pw" name="pw" th:field="*{pw}" th:errorclass="is-invalid">
                            <small class="text-danger" th:if="${#fields.hasErrors('pw')}" th:errors="*{pw}"></small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Daftar</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="/req/login">Sudah punya akun? Login</a>
            </div>
        </div>
    </div>
    <div class="row justify-content-center mt-3">
        <div class="col-md-6">
            <div th:if="${success}" class="alert alert-success text-center">
                <span th:text="${success}"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
